<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20010904//EN"
 "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet">

	<!-- Dark background to match site theme -->
	<rect width="100%" height="100%" fill="#09090b" />

	<defs>
		<linearGradient id="logoGrad" x1="18" y1="18" x2="102" y2="102" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffffff" />
			<stop offset="1" stop-color="#A1A1AA" />
		</linearGradient>
		<filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
			<feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.7" />
		</filter>
	</defs>

	<!-- Even larger centered rounded square (84x84) with stronger glow -->
	<rect x="18" y="18" width="84" height="84" rx="16" fill="url(#logoGrad)" filter="url(#logoGlow)" />

</svg>
